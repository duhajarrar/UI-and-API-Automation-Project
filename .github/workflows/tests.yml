name: Tests

# Runs on every push and pull request, and can also be started by hand from the Actions tab
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Part 1: UI tests with Playwright (TypeScript)
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "Part 1 - UI automation testing"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Part 1 - UI automation testing/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # --with-deps also installs Xvfb, a virtual display for running the browser headed on a server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        # Runs the browser headed inside the virtual display (see "headless" in playwright.config.ts)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test

      # Keep the reports even when tests fail
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: "Part 1 - UI automation testing/playwright-report/"
          retention-days: 14

      - name: Upload test results (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: "Part 1 - UI automation testing/test-results/"
          retention-days: 14

  # Part 2: REST API tests with pytest
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "Part 2 - API automation testing"
    env:
      # Set in GitHub: Settings → Secrets and variables → Actions
      TRACCAR_EMAIL: ${{ secrets.TRACCAR_EMAIL }}
      TRACCAR_PASSWORD: ${{ secrets.TRACCAR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest --junitxml=reports/junit.xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: "Part 2 - API automation testing/reports/"
          retention-days: 14